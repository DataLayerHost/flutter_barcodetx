name: Report Bug 🪲
description: Report a reproducible flutter_barcodetx problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include private keys, recovery phrases, or production signed transactions. Use synthetic data.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: Output of `flutter --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Target platform and OS
      placeholder: Android 16, iOS 19, Chrome 140, macOS 16
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include synthetic input, options, and frame ordering/drop behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or exception
