name: Feature Request 🔮
description: Propose an API, protocol, QR, or tooling improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What transport use case is not currently served?
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Wire compatibility
      options:
        - No wire-format change
        - Backward-compatible extension
        - New protocol version
        - Unsure
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: api
    attributes:
      label: Proposed Dart API or wire example
