name: flutter_barcodetx
description: Animated QR transport for already-signed blockchain transactions using deterministic fountain erasure coding.
version: 0.2.0
homepage: https://github.com/DataLayerHost/flutter_barcodetx
repository: https://github.com/DataLayerHost/flutter_barcodetx
documentation: https://github.com/DataLayerHost/flutter_barcodetx#readme
issue_tracker: https://github.com/DataLayerHost/flutter_barcodetx/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.1"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - blockchain
  - qr-code
  - fountain-code
  - transaction
  - offline

funding:
  - https://github.com/sponsors/bchainhub
